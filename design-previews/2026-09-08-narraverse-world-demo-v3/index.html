<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叙界 Narraverse · 世界工作区 Demo v3</title>
<style>
:root{
  --canvas:#171614; --surface:#211f1b; --surface2:#292720; --surface3:#302d26;
  --ink:#eee9df; --ink2:rgba(238,233,223,.74); --ink3:rgba(238,233,223,.5);
  --copper:#c99b58; --copper-dim:#8a6a3a;
  --green:#8fae8d; --red:#c77c72; --blue:#7d93a8; --violet:#9a87ab;
  --line:rgba(238,233,223,.12); --line2:rgba(238,233,223,.22);
  --radius:8px; --radius-s:6px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.7}
body{padding-top:52px;padding-left:168px;min-height:100vh}
a{color:var(--copper);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3a352c;border-radius:5px;border:2px solid var(--canvas)}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- 顶栏 ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(23,22,20,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.5px;cursor:pointer;white-space:nowrap;margin-right:8px}
.brand .moon{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 62% 38%,#d9b98a,var(--copper) 55%,#5c4527);box-shadow:0 0 8px rgba(201,155,88,.35)}
.brand small{color:var(--ink3);font-weight:400;font-size:11px;margin-left:2px}
.seg{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 10px;cursor:pointer;background:var(--surface);white-space:nowrap;font-size:12px;color:var(--ink2)}
.seg:hover{border-color:var(--line2)}
.seg b{color:var(--ink);font-weight:600}
.seg .k{color:var(--ink3)}
#modeSeg b{color:var(--copper)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{font-size:11.5px;border:1px solid rgba(201,155,88,.45);color:var(--copper);background:rgba(201,155,88,.08);padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.badge:hover{border-color:var(--copper)}
.badge.green{border-color:rgba(143,174,141,.4);color:var(--green);background:rgba(143,174,141,.08);cursor:default}
.ver-tag{font-size:11px;color:var(--ink3);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}

/* ---------- 左侧平台控制平面 ---------- */
#rail{position:fixed;top:52px;bottom:0;left:0;width:168px;z-index:40;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
.rail-cap{font-size:10.5px;color:var(--ink3);letter-spacing:2px;padding:0 8px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.rail-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--radius-s);color:var(--ink2);font-size:12.5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.rail-item:hover{background:var(--surface2);color:var(--ink)}
.rail-item.on{background:rgba(201,155,88,.1);border-color:rgba(201,155,88,.35);color:var(--copper);font-weight:600}
.rail-item .ic{width:15px;height:15px}
.rail-note{margin-top:12px;padding:8px;border:1px dashed var(--line2);border-radius:var(--radius-s);font-size:10.5px;color:var(--ink3);line-height:1.5}

/* ---------- 工作区导航 ---------- */
#wsNav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;align-items:center}
#wsNav a{color:var(--ink2);padding:7px 13px;font-size:13px;border-radius:var(--radius-s) var(--radius-s) 0 0;border-bottom:2px solid transparent}
#wsNav a:hover{color:var(--ink);background:var(--surface2)}
#wsNav a.on{color:var(--copper);border-bottom-color:var(--copper);background:rgba(201,155,88,.06);font-weight:600}
#wsNav .mode-tag{margin-left:auto;font-size:11px;color:var(--ink3)}

/* ---------- 通用组件 ---------- */
#app{max-width:1120px;margin:0 auto;padding:0 20px 90px}
.page-head{margin-bottom:18px}
.page-head h1{font-size:21px;font-weight:600;letter-spacing:.4px}
.page-head p{color:var(--ink2);font-size:13px;margin-top:2px}
.cards{display:grid;gap:14px}
.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.c4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{font-size:14px;font-weight:600;margin-bottom:6px}
.card .sub{color:var(--ink2);font-size:12px}
.card .desc{color:var(--ink2);font-size:12.5px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);color:var(--ink);border:1px solid var(--line2);border-radius:var(--radius-s);padding:7px 14px;font-size:13px;cursor:pointer;font-family:var(--font);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--copper);color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#1a160f;font-weight:600}
.btn.primary:hover{background:#d6a968;color:#1a160f}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--red);border-color:rgba(199,124,114,.4)}
.btn.danger:hover{background:rgba(199,124,114,.08)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.chip.copper{color:var(--copper);border-color:rgba(201,155,88,.4);background:rgba(201,155,88,.08)}
.chip.green{color:var(--green);border-color:rgba(143,174,141,.4);background:rgba(143,174,141,.08)}
.chip.red{color:var(--red);border-color:rgba(199,124,114,.4);background:rgba(199,124,114,.08)}
.chip.blue{color:var(--blue);border-color:rgba(125,147,168,.4);background:rgba(125,147,168,.08)}
.chip.violet{color:var(--violet);border-color:rgba(154,135,171,.4);background:rgba(154,135,171,.08)}
.chip.gray{color:var(--ink3)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius-s);color:var(--ink);padding:8px 10px;font-family:var(--font);font-size:13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--copper);box-shadow:0 0 0 2px rgba(201,155,88,.18)}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
.field{margin-bottom:10px}
.bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--copper)}
.bar.green>i{background:var(--green)} .bar.red>i{background:var(--red)} .bar.blue>i{background:var(--blue)} .bar.violet>i{background:var(--violet)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--ink2);padding:7px 12px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;font-family:var(--font)}
.tabs button.on{color:var(--copper);border-bottom-color:var(--copper)}
.stat-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 12px;font-size:12px;color:var(--ink2)}
.stat-item b{color:var(--ink);font-weight:600;margin-left:2px}
.feed-item{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);animation:rise .25s ease-out}
.feed-item+.feed-item{margin-top:8px}
.feed-time{color:var(--ink3);font-size:11px;white-space:nowrap;padding-top:2px;min-width:90px}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.muted{color:var(--ink3)} .dim{color:var(--ink2)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.divider{height:1px;background:var(--line);margin:14px 0}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.flex1{flex:1}
svg{display:block}
.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 世界上下文条 */
.ctxbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:9px 14px;font-size:12px;color:var(--ink2);margin-bottom:16px}
.ctxbar .seg-hi{color:var(--copper);font-weight:600}
.ctxbar .mono{color:var(--ink3)}

/* 模式入口卡 */
.mode-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.mode-card:hover{border-color:var(--copper)}
.mode-card .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.mode-card .cap{font-size:11.5px;color:var(--ink3);margin-top:6px}
.mode-card .cap b{color:var(--ink2);font-weight:500}

/* 事实 / 提案 */
.fact-card{border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 13px;background:var(--surface);margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.fact-card .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.fact-card .ft{font-size:11px;color:var(--ink3)}
.proposal-card{border:1px solid rgba(201,155,88,.4);border-left:3px solid var(--copper);border-radius:var(--radius-s);padding:13px;background:rgba(201,155,88,.05);margin-bottom:10px}
.proposal-card .src{font-size:11px;color:var(--ink3)}
.impact-line{font-size:12px;color:var(--ink2);margin-top:4px}
.impact-line b{color:var(--copper);font-weight:600}

/* 任务 */
.task-row{border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;background:var(--surface);margin-bottom:8px}
.task-row .st{width:64px;text-align:center;flex:none}
.task-row .prog{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-top:6px}
.task-row .prog>i{display:block;height:100%;background:var(--copper);border-radius:2px;transition:width .3s ease-out}

/* 沙盒 */
.sb-grid{display:grid;grid-template-columns:280px 1fr 260px;gap:14px;align-items:start}
@media(max-width:1060px){.sb-grid{grid-template-columns:1fr}}
.clock-box{text-align:center;padding:14px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.clock-box .era{font-size:11px;color:var(--copper);letter-spacing:2px}
.clock-box .num{font-size:28px;font-weight:700}
.clock-box .season{font-size:12px;color:var(--ink2);margin-top:2px}
.impact-row{margin-bottom:12px}
.impact-row .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px}
.rule-slider{margin-bottom:13px}
.rule-slider .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--copper)}
.sb-side-title{font-size:11.5px;color:var(--ink3);letter-spacing:1px;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--ink3);font-weight:400;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);color:var(--ink2)}
.tbl td:first-child{color:var(--ink)}
.ev-type{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);flex:none;height:fit-content;margin-top:2px}
.cand-card{border:1px solid var(--line2);border-radius:var(--radius-s);padding:12px;background:var(--surface);margin-bottom:10px;border-left:3px solid var(--copper)}
.perm-hint{font-size:11.5px;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--radius-s);padding:8px 10px;margin-top:8px;line-height:1.6}
.locked{opacity:.45;pointer-events:none}
.rule-hist{font-size:11.5px;color:var(--ink3);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;max-height:110px;overflow-y:auto}

/* 角色 / 双栏信息 */
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;color:#171614;font-weight:700}
.avatar.lg{width:80px;height:80px;font-size:30px}
.skill-tag{display:inline-block;font-size:11.5px;border:1px solid rgba(125,147,168,.4);color:var(--blue);background:rgba(125,147,168,.08);padding:2px 9px;border-radius:999px;margin:0 5px 5px 0}
.item-tag{display:inline-block;font-size:11.5px;border:1px solid rgba(201,155,88,.4);color:var(--copper);background:rgba(201,155,88,.08);padding:2px 9px;border-radius:999px;margin:0 5px 5px 0}
.ab-bar{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ab-bar .nm{width:92px;font-size:12px;color:var(--ink2);flex:none}
.ab-bar .bar{flex:1}
.ab-bar .val{font-size:11.5px;color:var(--ink3);width:32px;text-align:right;font-family:ui-monospace,monospace}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tl-item{position:relative;padding:0 0 14px 8px}
.tl-item:before{content:"";position:absolute;left:-17px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--canvas);border:2px solid var(--copper)}
.tl-item.green:before{border-color:var(--green)} .tl-item.red:before{border-color:var(--red)} .tl-item.blue:before{border-color:var(--blue)} .tl-item.violet:before{border-color:var(--violet)}
.tl-item .t{font-size:11.5px;color:var(--ink3);font-family:ui-monospace,Consolas,monospace}
.tl-item .tt{font-weight:600;font-size:13.5px;margin:1px 0 2px}
.tl-item .td{font-size:12.5px;color:var(--ink2)}

/* 空状态 */
.empty{border:1px dashed var(--line2);border-radius:var(--radius);padding:30px 18px;text-align:center;color:var(--ink3);font-size:12.5px}
.empty .act{margin-top:12px}

/* 抽屉 */
#drawer{position:fixed;inset:0;z-index:60;display:none}
#drawer.open{display:block}
#drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--surface);border-left:1px solid var(--line2);box-shadow:-12px 0 32px rgba(0,0,0,.4);padding:20px;overflow-y:auto;animation:slideIn .2s ease-out}
@keyframes slideIn{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.drawer-head h2{font-size:16px}

/* 对话（叙界模拟） */
.msg{display:flex;gap:10px;margin-bottom:12px}
.msg .bub{max-width:78%;border-radius:10px;padding:10px 13px;font-size:13.5px;line-height:1.8}
.msg.user{flex-direction:row-reverse}
.msg.user .bub{background:var(--surface3);border:1px solid var(--line2)}
.msg.npc .bub{background:var(--surface);border:1px solid var(--line)}
.msg .who{font-size:11px;color:var(--ink3);margin-bottom:2px}
.msg.npc .who{color:var(--green)}
.msg.user .who{color:var(--copper);text-align:right}

.foot{color:var(--ink3);font-size:11.5px;text-align:center;padding:24px 0 6px;border-top:1px solid var(--line);margin-top:44px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--copper);color:var(--ink);padding:10px 18px;border-radius:var(--radius);font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:rise .2s ease-out}
.import-zone{border:2px dashed var(--line2);border-radius:var(--radius);padding:24px;text-align:center;color:var(--ink2);cursor:pointer;transition:border-color .15s}
.import-zone:hover{border-color:var(--copper)}
</style>
</head>
<body>

<header id="topbar">
  <div class="brand" onclick="nav('#/overview')">
    <span class="moon"></span>
    <span>叙界 Narraverse<small>世界工作区 v3</small></span>
  </div>
  <div class="seg" onclick="openCp('book')" title="当前工作区 / 书籍（示例工程）"><span class="k">工作区</span><b id="segBook">《黑月挽歌》</b></div>
  <div class="seg" onclick="toggleWorldMenu()" title="当前世界"><span class="k">世界</span><b id="segWorld">黑月大陆</b></div>
  <div class="seg" id="modeSeg" onclick="nav('#/overview')" title="当前运行模式"><span class="k">模式</span><b id="segMode">世界工作区</b></div>
  <div class="top-right">
    <span class="badge" onclick="nav('#/facts')" id="propBadge">事实提案 1 待确认</span>
    <span class="ver-tag">世界版本 r17</span>
  </div>
</header>

<aside id="rail">
  <div class="rail-cap">平台控制平面</div>
  <div id="railItems"></div>
  <div class="rail-note">这是正式平台的既有控制平面：版本 / 书籍 / 总资料库 / 方案预设 / Skills / Agents / 自动化 / 设置。Demo 仅展示入口与映射，不重建这些系统。</div>
</aside>

<nav id="wsNav">
  <a href="#/overview" data-v="/overview">概览</a>
  <a href="#/binding" data-v="/binding">资料绑定</a>
  <a href="#/characters" data-v="/characters">角色</a>
  <a href="#/timeline" data-v="/timeline">时间线</a>
  <a href="#/facts" data-v="/facts">世界事实</a>
  <a href="#/tasks" data-v="/tasks">任务与健康</a>
  <span class="mode-tag" id="wsModeTag">世界工作区</span>
</nav>

<div id="drawer"></div>
<main id="app"></main>
<div class="foot">叙界 Narraverse · 世界工作区 Demo v3 · 全部数据为本地模拟；不读取、不输出 API Key；未写入任何真实资料库</div>

<script>
'use strict';
/* =========================================================
   叙界 Narraverse · 世界工作区 Demo v3
   定位：世界工作区 = 世界的舞台、资料上下文与长期记忆
       现有 Denova 侧栏（方案预设/Skills/Agents/写作/游戏/叙界/沙盒）= 平台控制平面
   ========================================================= */

/* ---------------- 图标 ---------------- */
const IC={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>',
  git:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 16V8a4 4 0 0 1 4-4h4"/><path d="M16 8v6a2 2 0 0 1-2 2h-3"/>',
  file:'<path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/>',
  db:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5V12c0 1.7 3.6 3 8 3s8-1.3 8-3V5.5"/><path d="M4 12v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V12"/>',
  layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',
  layers:'<path d="M12 3 3.5 8 12 13l8.5-5z"/><path d="M3.5 12.5 12 17.5l8.5-5"/><path d="M3.5 16.5 12 21.5l8.5-5"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/><rect x="9.5" y="9.5" width="5" height="5"/>',

function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';},1800);setTimeout(function(){t.remove();},2300);}
function nav(h){location.hash=h;}
function pct(v){return Math.round(v*100)+'%';}
function bar(v,color){return '<div class="bar '+(color||'')+'"><i style="width:'+Math.max(2,Math.min(100,v))+'%"></i></div>';}
function factChip(t){return {confirmed:['green','已发生事实'],'char-known':['blue','角色已知'],'player-known':['copper','玩家已知'],plan:['violet','未来计划'],proposal:['copper','提案'],rejected:['gray','被拒绝']}[t]||['gray',t];}

/* ---------------- 路由 ---------------- */
const ROUTES={};
function route(){
  var h=location.hash.replace(/^#/,'')||'/overview';
  var m=h.match(/^\/characters\/(\w+)/);
  if(m&&ROUTES['/characters/:id']){render(ROUTES['/characters/:id'](m[1]));setNav('/characters');return;}
  if(ROUTES[h]){render(ROUTES[h]());setNav(h);return;}
  render(ROUTES['/overview']());setNav('/overview');
}
function setNav(h){
  document.querySelectorAll('#wsNav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-v')===h);});
  var m={'/writing':'写作模式','/game':'结构化游戏','/narraverse':'叙界','/sandbox':'开放沙盒'}[h];
  if(m){CUR.mode=m;$('#wsModeTag').textContent='当前模式：'+m;}else{CUR.mode='世界工作区';$('#wsModeTag').textContent='世界工作区';}
  $('#segMode').textContent=CUR.mode;
  $('#propBadge').textContent='事实提案 '+pendingProposalCount()+' 待确认';
}
function render(html){$('#app').innerHTML=html;window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

/* 世界切换 */
function toggleWorldMenu(){
  openDrawerHtml('<h2>切换世界</h2>','<p class="dim" style="margin-bottom:10px">选择要进入的世界工作区。非「黑月大陆」的世界尚未初始化，可走资料绑定流程创建。</p>'+
    WORLDS.map(function(w){return '<div class="feed-item" style="cursor:pointer" onclick="switchWorld(\''+w.id+'\')"><span class="chip '+(w.id===CUR.world?'green':'gray')+'">'+(w.id===CUR.world?'当前':'')+'</span><div style="flex:1"><b>'+w.name+'</b><div class="muted" style="font-size:11px">'+w.type+' · '+w.era+'</div></div></div>';}).join(''));
}
function switchWorld(id){
  CUR.world=id;closeDrawer();
  $('#segWorld').textContent=curWorld().name;
  toast('已切换到「'+curWorld().name+'」');
  nav('#/overview');
}

    '<div class="empty">该世界尚未绑定任何资料。<div class="act"><button class="btn primary" onclick="pickImport()">模拟选择文件并解析</button></div></div>'+

  return '<div class="page-head"><h1>资料绑定</h1><p>总资料库原始资产 → 当前世界绑定 → 世界内角色 / 设定实例。绑定不会修改总资料库原件。</p></div>'+

      '<div class="sb-side-title" style="margin:10px 0 6px">角色卡（5）</div>'+
      LIBRARY.cards.map(function(c){var b=WORLD.bindings.find(function(x){return x.aid===c.id;});return assetRow(c,b);}).join('')+
      '<div class="sb-side-title" style="margin:12px 0 6px">设定书（4）</div>'+
      LIBRARY.books.map(function(c){var b=WORLD.bindings.find(function(x){return x.aid===c.id;});return assetRow(c,b);}).join('')+
    '</div>'+
  '</div>'+
  '<div class="card mt14"><h3>当前世界绑定摘要</h3><p class="sub">绑定状态：已绑定 / 待处理 / 已归档</p>'+
    '<div class="grid mt8" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px">'+
    WORLD.bindings.map(function(b){
      var a=LIBRARY.cards.find(function(c){return c.id===b.aid;})||LIBRARY.books.find(function(c){return c.id===b.aid;});
      var st=b.status==='bound'?['green','已绑定']:b.status==='pending'?['red','待处理']:['gray','已归档'];
      return '<div class="feed-item"><div style="flex:1"><div class="row spread"><b style="font-size:12.5px">'+a.n+'</b><span class="chip '+st[0]+'">'+st[1]+'</span></div>'+
        '<div class="muted" style="font-size:11px">'+(b.kind==='card'?'角色卡':'设定书')+' · '+b.v+(b.trans?(' · '+b.trans):'')+'</div>'+
        (b.boundAs?'<div class="dim" style="font-size:11.5px">绑定为：'+b.boundAs+'</div>':'')+
        (b.issue?'<div class="red" style="font-size:11.5px;color:var(--red)">'+b.issue+'</div>':'')+
        '</div></div>';
    }).join('')+'</div></div>';
};
function assetRow(a,b){
  var st=b?b.status:'unbound';
  var chip=st==='bound'?'<span class="chip green">已绑定</span>':st==='pending'?'<span class="chip red">待处理</span>':st==='archived'?'<span class="chip gray">已归档</span>':'<span class="chip blue">未绑定</span>';
  return '<div class="feed-item" style="padding:8px 10px"><div style="flex:1"><div class="row spread"><b style="font-size:12.5px">'+a.n+'</b>'+chip+'</div>'+
    '<div class="muted" style="font-size:11px">'+a.file+' · '+a.v+(a.trans?(' · '+a.trans):'')+'</div>'+
    '<div class="dim" style="font-size:11.5px">'+a.desc+'</div>'+
    (a.conflict?'<div style="font-size:11.5px;color:var(--red)">⚠ '+a.conflict+'</div>':'')+
    '</div></div>';
}
function pickImport(){
  var f=IMPORT_FILES[IMPORT_IDX%IMPORT_FILES.length];IMPORT_IDX++;
  $('#impBox').innerHTML='<div class="feed-item mt8" style="border-color:rgba(201,155,88,.4)"><div style="flex:1"><div class="row spread"><b style="font-size:12.5px;color:var(--copper)">'+esc(f[0])+'</b><span class="chip">'+esc(f[1])+'</span></div>'+
    '<div class="dim" style="font-size:12px;margin-top:4px">'+esc(f[2])+'</div>'+
    '<div class="row mt8">'+
      '<button class="btn sm primary" onclick="confirmBind()">确认绑定到世界（模拟）</button>'+
      '<button class="btn sm" onclick="resetImport()">重新选择</button>'+
    '</div></div></div>';
  toast('已解析：'+f[0]+'（Demo 模拟，未写入总资料库）');
}
function resetImport(){$('#impBox').innerHTML='';}
function confirmBind(){
  $('#impBox').innerHTML='';
  toast('已创建世界绑定（Demo 模拟：仅记录绑定关系，不修改总资料库原件）');
  nav('#/binding');
}

var TASKS=[
  {id:'t1', name:'解析角色卡 · 林夜', src:'资料绑定 · 总资料库 + 配置管理 Agent', what:'读取角色卡 7 个字段并建立世界实例', impact:'林夜角色卡 → 世界实例', status:'done', result:'成功：12 字段映射完成', confirm:false},
  {id:'t2', name:'检查设定冲突 · 摩洛克', src:'资料绑定 · /master-library', what:'比对摩洛克角色卡与《黑月之渊》条目', impact:'摩洛克角色卡 · 黑月之渊设定', status:'failed', result:'发现重复描述，已标记待处理', confirm:false},
  {id:'t3', name:'写作 Agent 生成章节草稿', src:'写作模式 · 写作 Agent + /continue', what:'基于第 2 章大纲续写草稿', impact:'章节 · 时间线（可能产生提案）', status:'queued', result:null, confirm:true},
  {id:'t4', name:'后台导演完成回合分析', src:'结构化游戏 · 后台导演 Agent + Story Director', what:'分析上一回合行动对势力的影响', impact:'势力状态 · Actor State', status:'stopped', result:'已停止：用户中止分析', confirm:false},
  {id:'t5', name:'沙盒推进 7 天', src:'开放沙盒 · Module4 运行时 + 自动化', what:'推进世界时钟并生成事件候选', impact:'世界时钟 · 事件候选', status:'queued', result:null, confirm:false},
  {id:'t6', name:'定时世界快照', src:'自动化 · 定时任务', what:'为世界工作区生成每日快照', impact:'世界版本 r17 → r18', status:'idle', result:null, confirm:false}
];
var TASK_RUN={};
function taskChip(s){return {done:['green','已完成'],queued:['blue','排队中'],running:['copper','运行中'],waiting:['violet','等待确认'],failed:['red','失败'],stopped:['gray','已停止'],idle:['gray','待命']}[s]||['gray',s];}
function taskRow(t){
  var c=taskChip(t.status);
  var prog=TASK_RUN[t.id]?TASK_RUN[t.id].p:0;
  var act='';
  if(t.status==='queued')act='<button class="btn sm" onclick="runTask(\''+t.id+'\')">启动</button>';
  if(t.status==='running')act='<button class="btn sm danger" onclick="stopTask(\''+t.id+'\')">停止</button>';
  if(t.status==='waiting'){
    act='<button class="btn sm primary" onclick="confirmTask(\''+t.id+'\')">确认写入</button>'+
        '<button class="btn sm" onclick="nav(\'#/facts\')">查看提案</button>'+
        '<button class="btn sm danger" onclick="rejectTask(\''+t.id+'\')">拒绝</button>';
  }
  if(t.status==='failed')act='<button class="btn sm" onclick="retryTask(\''+t.id+'\')">重试</button><button class="btn sm danger" onclick="stopTask(\''+t.id+'\')">停止</button>';
  if(t.status==='stopped'||t.status==='idle')act='<button class="btn sm" onclick="runTask(\''+t.id+'\')">启动</button>';
  return '<div class="task-row" id="task-'+t.id+'"><div class="row spread"><div style="flex:1">'+
    '<div class="row"><b style="font-size:13px">'+t.name+'</b><span class="chip '+c[0]+'" style="min-width:52px;justify-content:center">'+c[1]+'</span></div>'+
    '<div class="muted" style="font-size:11px;margin-top:2px">'+t.src+'</div>'+
    '<div class="dim" style="font-size:12px;margin-top:2px">处理：'+t.what+' · 影响：'+t.impact+'</div>'+
    (t.status==='running'?'<div class="prog"><i style="width:'+prog+'%"></i></div>':'')+
    (t.result?'<div style="font-size:12px;margin-top:4px;color:'+(t.status==='failed'?'var(--red)':'var(--ink2)')+'">结果：'+t.result+'</div>':'')+
    '</div><div class="row">'+act+'</div></div></div>';
}
function runTask(id){
  var t=TASKS.find(function(x){return x.id===id;});if(!t||t.status==='running')return;
  if(t.status==='done'){toast('该任务已完成');return;}
  t.status='running';t.result=null;
  TASK_RUN[id]={p:0,timer:null};
  renderAll();
  TASK_RUN[id].timer=setInterval(function(){
    TASK_RUN[id].p+=8+Math.random()*10;
    var row=$('#task-'+id);
    if(row){var pr=row.querySelector('.prog i');if(pr)pr.style.width=Math.min(100,TASK_RUN[id].p)+'%';}
    if(TASK_RUN[id].p>=100){
      clearInterval(TASK_RUN[id].timer);
      if(t.confirm){t.status='waiting';t.result='草稿已生成，等待你确认是否进入时间线';}
      else{t.status='done';t.result=id==='t5'?'候选已生成（去沙盒查看与应用）':'快照已写入世界版本 r18';if(id==='t6')CUR.version='r18';}
      renderAll();toast('任务完成：'+t.name);
    }
  },160);
}
function stopTask(id){var t=TASKS.find(function(x){return x.id===id;});if(!t)return;if(TASK_RUN[id]&&TASK_RUN[id].timer)clearInterval(TASK_RUN[id].timer);t.status='stopped';t.result='已停止：用户中止';renderAll();toast('已停止：'+t.name);}
function retryTask(id){var t=TASKS.find(function(x){return x.id===id;});if(!t)return;t.status='queued';t.result=null;renderAll();toast('已重新排队：'+t.name);}
function rejectTask(id){var t=TASKS.find(function(x){return x.id===id;});if(!t)return;t.status='stopped';t.result='已拒绝：内容未写入时间线';renderAll();toast('已拒绝写入：'+t.name);}
function confirmTask(id){
  var t=TASKS.find(function(x){return x.id===id;});if(!t)return;
  if(id==='t3'){
    FACTS.unshift({id:'f'+Date.now(),type:'confirmed',t:'艾琳在烧焦魔法书中发现影裔教团信物',tm:'第 7 年 · 春 · 已确认',src:'写作模式 · 章节草稿'});
    TIMELINE.push({y:'第 7 年 · 春', t:'艾琳发现教团信物（章节事件已确认）', tag:'已确认'});
  }
  t.status='done';t.result='已确认：内容写入世界时间线与事实';renderAll();refreshBadge();toast('已确认写入：「'+t.name+'」');
}
function runAllQueued(){TASKS.filter(function(t){return t.status==='queued'||t.status==='idle'||t.status==='stopped';}).forEach(function(t){runTask(t.id);});}
function renderAll(){renderTasks();}

  return '<div class="page-head"><h1>任务与健康</h1><p>由现有平台模块产生的任务状态：待命 / 排队中 / 运行中 / 等待确认 / 已完成 / 失败 / 已停止。Demo 不虚构独立 Agent，来源模块均为正式平台既有能力。</p></div>'+

    '<span class="chip blue">排队中 '+TASKS.filter(function(t){return t.status==='queued';}).length+'</span>'+
    '<span class="chip copper">运行中 '+TASKS.filter(function(t){return t.status==='running';}).length+'</span>'+
    '<span class="chip violet">等待确认 '+TASKS.filter(function(t){return t.status==='waiting';}).length+'</span>'+

    for(var k=0;k<w.length;k++){r-=w[k];if(r<=0){ti=k;break;}}
    var type=types[ti];
    var pool=SB_POOL[type];
    var ev=pool[Math.floor(Math.random()*pool.length)];
    var f=SB.factions[Math.floor(Math.random()*SB.factions.length)];
    var rg=SB.regions[Math.floor(Math.random()*SB.regions.length)];
    var fd=Math.round(Math.random()*6+1),rd=Math.round(Math.random()*6+2);
    out.push({type:type,t:ev[0],d:ev[1],impact:{who:rg.n+' 的巡夜人最先发现异常。',factions:[{n:f.n,delta:fd}],regions:[{n:rg.n,delta:-rd}]}});
  }
  return out;
}

/* ---------------- 冒烟自测（?smoke=1 时自动运行，仅用于验证） ---------------- */
function waitUntil(fn,timeout){
  return new Promise(function(res){
    var t0=Date.now();
    (function poll(){
      if(fn()){res(true);return;}
      if(Date.now()-t0>timeout){res(false);return;}
      setTimeout(poll,150);
    })();
  });
}
function smokeRun(){
  var out=[],steps=[];
  function push(label,fn){steps.push([label,fn]);}
  push('OVERVIEW',function(){location.hash='#/overview';route();return $('#app').innerHTML.indexOf('世界工作区概览')>=0;});
  push('CP_PRESETS',function(){openCp('presets');var ok=$('#drawer').classList.contains('open')&&$('#drawer').innerHTML.indexOf('方案预设')>=0;closeDrawer();return ok;});
  push('BINDING_PARSE',function(){location.hash='#/binding';route();pickImport();return $('#impBox').innerHTML.indexOf('确认绑定到世界')>=0;});
  push('CHAR_LAYERS',function(){location.hash='#/characters/linye';route();var h=$('#app').innerHTML;return h.indexOf('原始角色资料')>=0&&h.indexOf('世界内角色状态')>=0;});
  push('ADOPT',function(){var c0=confirmedCount();adoptProposal('pr2');return confirmedCount()===c0+1;});
  push('REJECT',function(){var r0=FACTS.filter(function(f){return f.type==='rejected';}).length;rejectProposal('pr1');return FACTS.filter(function(f){return f.type==='rejected';}).length===r0+1;});
  push('WRITE_PROP',function(){var p0=pendingProposalCount();writingProposal();return pendingProposalCount()>p0;});
  push('GAME_MOVE',function(){location.hash='#/game';route();gmChoice(0);return GM.scene!=='s1';});
  push('NARRA_MSG',function(){location.hash='#/narraverse';route();$('#nvInput').value='我想知道契约之书的下落';nvSend();return NV.length>=4;});
  push('SB_TICK_REVIEW',function(){
    location.hash='#/sandbox';route();
    if(!$('#sbRunCtl')){throw new Error('no #sbRunCtl; app='+($('#app')?$('#app').innerHTML.length:0)+' head='+($('#app')?$('#app').innerHTML.slice(0,120).replace(/<[^>]+>/g,''):''));}
    sbTick(7);
    return waitUntil(function(){return SB.status!=='running'&&SB.status!=='paused';},4000).then(function(){return SB.status==='review'&&SB.candidates.length>0;});
  });
  push('SB_APPLY',function(){
    var f0=confirmedCount();sbApply();
    return waitUntil(function(){return SB.status==='idle';},500).then(function(){return confirmedCount()>f0;});
  });
  push('SB_PERM_OBSERVER',function(){
    sbIdentity('observer');var c0=pendingProposalCount();sbAddEvent();return pendingProposalCount()===c0;
  });
  push('SB_CHAR',function(){
    sbIdentity('character');
    if(!$('#sbCharName')){throw new Error('no #sbCharName after sbIdentity; app='+($('#app')?$('#app').innerHTML.length:0));}
    $('#sbCharName').value='测试旅人';sbCreateChar();return SB.myChars.length>0;
  });
  push('SB_RULE',function(){
    sbIdentity('director');sbRule('magic',0.9);return Math.abs(SB.rules.magic-0.9)<0.001&&SB.ruleHist.length>0;
  });
  push('TASK_T5_DONE',function(){
    runTask('t5');
    return waitUntil(function(){var t=TASKS.find(function(x){return x.id==='t5';});return t.status==='done'||t.status==='stopped';},5000).then(function(){return TASKS.find(function(t){return t.id==='t5';}).status==='done';});
  });
  push('TASK_T3_WAITING',function(){
    runTask('t3');
    return waitUntil(function(){var t=TASKS.find(function(x){return x.id==='t3';});return t.status==='waiting';},5000).then(function(){return TASKS.find(function(t){return t.id==='t3';}).status==='waiting';});
  });
  push('TASK_CONFIRM',function(){
    var c0=confirmedCount();confirmTask('t3');return confirmedCount()===c0+1;
  });
  var i=0;
  function next(){
    if(i>=steps.length){printSmoke(out);return;}
    var s=steps[i++];
    try{
      var r=s[1]();
      if(r&&r.then){r.then(function(v){out.push(s[0]+':'+(v?'OK':'FAIL'));next();},function(e){out.push(s[0]+':ERR '+e.message);next();});}
      else{out.push(s[0]+':'+(r?'OK':'FAIL'));next();}
    }catch(e){out.push(s[0]+':ERR '+e.message);next();}
  }
  next();
}
function printSmoke(out){
  var pre=document.createElement('pre');pre.id='smokeResult';
  pre.textContent='SMOKE\n'+out.join('\n');
  document.body.appendChild(pre);
}
if(location.search.indexOf('smoke=1')>=0){setTimeout(smokeRun,300);}

$('#railItems').innerHTML=railHtml();
$('#segWorld').textContent=curWorld().name;
$('#segBook').textContent='《黑月挽歌》';
$('#segMode').textContent='世界工作区';
$('#propBadge').textContent='事实提案 '+pendingProposalCount()+' 待确认';
route();
</script>
