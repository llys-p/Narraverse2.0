<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interaction Core · 候选 A</title>
<style>
body{font:16px/1.7 system-ui;background:#f4f1e8;color:#26352e;margin:30px auto;padding:0 20px;max-width:1000px}
header{border-bottom:1px solid #aaa}main{display:grid;grid-template-columns:2fr 1fr;gap:24px}button,input,textarea{font:inherit;padding:8px}
textarea{box-sizing:border-box;width:100%;min-height:100px}button{cursor:pointer;margin:8px 4px 8px 0}article{background:white;padding:18px;margin:12px 0;white-space:pre-wrap}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}aside{background:#e6ecdf;padding:16px}#status{color:#785121}@media(max-width:700px){main{display:block}}
</style>
<header><h1>自由交互 · 候选 A</h1><p>语义理解 → 事实检查 → 分级结算 → 提交 → 结果表达</p></header>
<p>酒馆里有莉亚、奥伦。你持有徽章、小刀和苹果。地窖门锁着，钥匙在旧井。默认向莉亚说话，可在原文中指定其他对象。</p>
<main><section>
<label>会话 <input id="session" value="candidate-a-demo"></label>
<button id="refresh">读取状态</button><button id="newSession">新会话</button>
<div id="dialogue" aria-live="polite"></div>
<label for="message">你的行动</label><textarea id="message" placeholder="我把徽章交给莉亚，请她核验；再问奥伦是否认识上面的编号。"></textarea>
<button id="prepare">分析并预览</button><button id="commit" disabled>确认提交</button>
<p id="status" role="status"></p>
<details><summary>本轮完整过程</summary><pre id="trace"></pre></details>
</section><aside><h2>已提交状态</h2><pre id="state"></pre><p>预览不会修改这里。结算中的说服成功仅表示愿意商谈，不代表承诺、交出物品或泄密。</p></aside></main>
<script>
const el=id=>document.getElementById(id);
let snapshot=null, pending=null, busy=false;
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error?.code+': '+j.error?.message);return j;}
function showState(s){snapshot=s;el('state').textContent=JSON.stringify(s.states,null,2);}
async function read(){showState(await api('/interaction/state?session_id='+encodeURIComponent(el('session').value)));}
async function run(fn){if(busy)return;busy=true;el('prepare').disabled=true;el('commit').disabled=true;el('session').disabled=true;try{await fn();}catch(e){el('status').textContent=e.message;}finally{busy=false;el('prepare').disabled=false;el('commit').disabled=!pending;el('session').disabled=false;}}
el('refresh').onclick=()=>run(read);
el('newSession').onclick=()=>run(async()=>{el('session').value='a-'+crypto.randomUUID().slice(0,8);pending=null;el('dialogue').replaceChildren();el('trace').textContent='';await read();});
el('session').onchange=()=>{pending=null;snapshot=null;el('commit').disabled=true;};
el('prepare').onclick=()=>run(async()=>{pending=null;await read();const req={session_id:el('session').value,event_id:crypto.randomUUID(),actor_id:'player',message:el('message').value,expected_versions:snapshot.versions};el('status').textContent='正在理解和结算…';const p=await api('/interaction/prepare',req);pending={request:req,preview:p};el('trace').textContent=JSON.stringify(p,null,2);el('status').textContent='预览就绪。确认后才写入状态。';});
el('commit').onclick=()=>run(async()=>{const p=pending;const req={session_id:p.request.session_id,event_id:p.request.event_id,analysis_id:p.preview.analysis_id,expected_versions:p.request.expected_versions};el('status').textContent='正在提交…';const receipt=await api('/interaction/commit',req);pending=null;showState({states:receipt.states,versions:receipt.versions});el('trace').textContent=JSON.stringify(receipt,null,2);el('status').textContent='已提交。';const reply=await api('/interaction/narrate',{session_id:req.session_id,event_id:req.event_id});const card=document.createElement('article');card.textContent='你：'+p.request.message+'\n\n'+reply.text;el('dialogue').append(card);el('trace').textContent=JSON.stringify({receipt,narration:reply},null,2);});
run(read);
</script></html>
