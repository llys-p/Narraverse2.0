      var li = document.createElement("li");
      var hasKids = it.c && it.c.length;

      row.className = "node" + (it.st==="warn"?"":"");
      var caret = document.createElement("span");
      caret.className = "caret" + (hasKids?"":" empty");

      row.appendChild(caret);
      var nm = document.createElement("span");
      nm.className = "nm" + (hasKids?"":" leaf");
      nm.textContent = it.n;
      row.appendChild(nm);
      if (BADGE[it.st]){ var b = document.createElement("span"); b.className = "badge " + BADGE[it.st][0]; b.textContent = BADGE[it.st][1]; row.appendChild(b); }

      var childUl = null;

        childUl = document.createElement("ul");
        renderList(childUl, it.c);
        li.appendChild(childUl);
      }
