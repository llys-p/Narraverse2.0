      targetPosition: left
      type: custom
      width: 242
    - data:
        code_language: python3
        variables:
        - variable: llm_text
          value_selector:
          - '1788869002316'
          - text
        - variable: target_language
          value_selector:
          - '1788868888476'
          - target_language
        code: |
          import json

          def text_value(value):
              if value is None:
                  return ""
              if isinstance(value, list):
                  values = [text_value(item) for item in value]
                  return "\\n\\n".join(item for item in values if item)
              if isinstance(value, dict):
                  return json.dumps(value, ensure_ascii=False)
              return str(value).strip()

          def string_list(value):
              if value is None:
                  return []
              if isinstance(value, list):
                  return [text_value(item) for item in value if text_value(item)]
              value = text_value(value)
              return [value] if value else []

          def load_json(raw):
              raw = text_value(raw).strip()
              if raw.startswith("```"):
                  raw = raw.replace("```json", "", 1).replace("```", "")
              start = raw.find("{")
              end = raw.rfind("}")
              if start < 0 or end < start:
                  raise ValueError("LLM output does not contain a JSON object")
              return json.loads(raw[start:end + 1])

          def main(llm_text: str, target_language: str):
              warnings = []
              try:
                  source = load_json(llm_text)
              except Exception:
                  source = {}
                  warnings.append("模型输出不是完整 JSON，已返回空字段结构")

              scalar_fields = [
                  "name", "description", "personality", "appearance", "identity",
                  "relationships", "background", "worldview", "behavior", "speech_style",
                  "abilities", "boundaries", "scenario", "first_mes", "creator_notes",
                  "system_prompt", "post_history_instructions",
              ]
              card = {field: text_value(source.get(field, "")) for field in scalar_fields}
              card["alternate_greetings"] = string_list(source.get("alternate_greetings"))
              card["tags"] = string_list(source.get("tags"))
              warnings.extend(string_list(source.get("warnings")))

              english = text_value(target_language).lower().startswith(("en", "英语", "英文"))
              titles = {
                  "identity": "Identity" if english else "身份信息",
                  "appearance": "Appearance" if english else "外观",
                  "personality": "Personality" if english else "性格",
                  "relationships": "Relationships" if english else "关系",
                  "background": "Background" if english else "背景",
                  "worldview": "Worldview" if english else "世界观",
                  "scenario": "Scenario" if english else "场景",
                  "behavior": "Behavior and rules" if english else "行为与规则",
                  "speech_style": "Speech style" if english else "说话风格",
                  "abilities": "Abilities" if english else "能力",
                  "boundaries": "Boundaries" if english else "边界",
                  "other": "Other" if english else "其他",
              }
              labels = {
                  "name": "Name" if english else "姓名",
                  "identity": "Identity details" if english else "身份细节",
                  "description": "Overview" if english else "概述",
                  "appearance": "Appearance details" if english else "外观细节",
                  "personality": "Personality traits" if english else "性格特点",
                  "relationships": "Relationships" if english else "人物关系",
                  "background": "Background" if english else "经历背景",
                  "worldview": "Worldview" if english else "世界观",
                  "scenario": "Scenario" if english else "场景设定",
                  "first_mes": "First message" if english else "首条消息",
                  "behavior": "Behavior rules" if english else "行为规则",
                  "speech_style": "Speech style" if english else "说话风格",
                  "abilities": "Abilities" if english else "能力",
                  "boundaries": "Boundaries" if english else "边界",
                  "creator_notes": "Creator notes" if english else "作者备注",
                  "system_prompt": "System prompt" if english else "系统提示",
                  "post_history_instructions": "Post-history instructions" if english else "历史消息后指令",
                  "tags": "Tags" if english else "标签",
              }
              sections = []

              def add_section(category, pairs):
                  items = []
                  for key, value in pairs:
                      value = text_value(value)
                      if value:
                          items.append({"key": key, "label": labels.get(key, key), "value": value})
                  if items:
                      sections.append({"category": category, "title": titles[category], "items": items})

              add_section("identity", [("name", card["name"]), ("identity", card["identity"]), ("description", card["description"])])
              add_section("appearance", [("appearance", card["appearance"])])
              add_section("personality", [("personality", card["personality"])])
              add_section("relationships", [("relationships", card["relationships"])])
              add_section("background", [("background", card["background"])])
              add_section("worldview", [("worldview", card["worldview"])])
              add_section("scenario", [("scenario", card["scenario"]), ("first_mes", card["first_mes"])])
              add_section("behavior", [("behavior", card["behavior"]), ("system_prompt", card["system_prompt"]), ("post_history_instructions", card["post_history_instructions"])])
              add_section("speech_style", [("speech_style", card["speech_style"])])
              add_section("abilities", [("abilities", card["abilities"])])
              add_section("boundaries", [("boundaries", card["boundaries"])])
              add_section("other", [("creator_notes", card["creator_notes"]), ("tags", ", ".join(card["tags"]))])

              card["sections"] = sections
              card["warnings"] = warnings
              return {"normalized_card": json.dumps(card, ensure_ascii=False)}
        outputs:
          normalized_card:
            type: string
        selected: false
        title: 格式整理与条目分类
        type: code
